<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Choose who gets your Bitcoin Cash. If you stop checking in, your family can receive their shares through your inheritance plan." />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1222" media="(prefers-color-scheme: dark)" />
    <title>Pusaka: Your BCH. Their future.</title>
    <meta name="referrer" content="no-referrer" />
    <script>
      // GitHub Pages answers every unknown path with the main app's 404 page. A deep link into the test-network
      // app (a separate build in its own folder) is sent there, and that app puts the full address back.
      (function () {
        var app = '%BASE_URL%', chipnet = '%PUSAKA_CHIPNET_BASE%', key = 'pusaka-redirect';
        if (!chipnet) return;
        try {
          if (app !== chipnet && location.pathname.indexOf(chipnet) === 0) {
            sessionStorage.setItem(key, location.pathname + location.search + location.hash);
            location.replace(chipnet);
          } else if (app === chipnet) {
            var to = sessionStorage.getItem(key);
            sessionStorage.removeItem(key);
            if (to && to.indexOf(chipnet) === 0) history.replaceState(null, '', to);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      try {
        const theme = localStorage.getItem('pusaka-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
      const base = '%BASE_URL%';
      if (location.pathname.replace(/\/$/, '') === base.slice(0, -1)) {
        const frame = matchMedia('(min-width: 900px)').matches ? 'wide' : 'tall';
        const theme = document.documentElement.dataset.theme;
        const dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
        const poster = document.createElement('link');
        poster.rel = 'preload';
        poster.as = 'image';
        poster.fetchPriority = 'high';
        poster.href = base + 'hero/pusaka-sawah-v3-' + frame + (dark ? '-dark' : '') + '.webp';
        document.head.append(poster);
      }
    </script>
    <style>
      #splash {
        --s-bg: #FAF7F2; --s-ink: #131B33; --s-gold: #93633A;
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        color: var(--s-ink); background: var(--s-bg);
        animation: loading-in 160ms ease 180ms both;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash { --s-bg: #0E1222; --s-ink: #FFF8EC; --s-gold: #E3CA8E; }
      }
      :root[data-theme='dark'] #splash { --s-bg: #0E1222; --s-ink: #FFF8EC; --s-gold: #E3CA8E; }
      #splash svg { width: 72px; height: 72px; fill: currentColor; }
      #splash circle { fill: var(--s-gold); }
      @keyframes loading-in { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Pusaka">
      <svg aria-hidden="true" viewBox="6.6 6.6 18.8 18.8">
        <path d="M24.415 7.585A5.2 3.4 -45 0 0 17.061 14.939A5.2 3.4 -45 0 0 24.415 7.585Z" />
        <path d="M24.415 24.415A5.2 3.4 45 0 1 17.061 17.061A5.2 3.4 45 0 1 24.415 24.415Z" />
        <path d="M7.585 24.415A5.2 3.4 -45 0 0 14.939 17.061A5.2 3.4 -45 0 0 7.585 24.415Z" />
        <path d="M7.585 7.585A5.2 3.4 45 0 1 14.939 14.939A5.2 3.4 45 0 1 7.585 7.585Z" />
        <circle cx="16" cy="16" r="1.2" />
      </svg>
    </div>
    <noscript>
      <style>#splash { display: none; }</style>
      <p>Enable JavaScript to use Pusaka.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
